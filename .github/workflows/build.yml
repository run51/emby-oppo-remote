name: build
on:
  push:
  pull_request:
jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/Emby.IsoBluray -c Release
      - run: dotnet build src/Emby.Oppo -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            src/Emby.IsoBluray/bin/Release/netstandard2.0/Emby.IsoBluray.dll
            src/Emby.Oppo/bin/Release/netstandard2.0/Emby.Oppo.dll
