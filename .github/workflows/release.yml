# Builds the plugins and creates a GitHub release when a version tag (v*) is pushed.
# The Android app is built and signed locally (private key); its signed APK is committed
# at src/Emby.Oppo/Remote/oppo.apk, embedded in Emby.Oppo.dll and attached to the release.
name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check Emby.Oppo version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(grep -oP '(?<=<Version>)[^<]+' src/Emby.Oppo/Emby.Oppo.csproj)"
          echo "tag=$TAG csproj=$VER"
          [ "$TAG" = "$VER" ]

      - name: Build plugins
        run: |
          dotnet build src/Emby.IsoBluray -c Release
          dotnet build src/Emby.Oppo -c Release
          mkdir dist
          cp src/Emby.Oppo/bin/Release/netstandard2.0/Emby.Oppo.dll dist/
          cp src/Emby.IsoBluray/bin/Release/netstandard2.0/Emby.IsoBluray.dll dist/
          cp src/Emby.Oppo/Remote/oppo.apk dist/OPPO.apk

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk "/^## v?${VERSION}\$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          printf '\n**Install:** copy `Emby.Oppo.dll` and `Emby.IsoBluray.dll` into Emby'"'"'s `plugins` folder and restart Emby. Android app: `OPPO.apk`. See the README.\n' >> notes.md
          cat notes.md

      - uses: ncipollo/release-action@v1
        with:
          bodyFile: notes.md
          artifacts: "dist/Emby.Oppo.dll,dist/Emby.IsoBluray.dll,dist/OPPO.apk"
