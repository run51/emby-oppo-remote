<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OPPO">
<title>OPPO</title>
<link rel="manifest" href="Remote/app.webmanifest" id="manifest">
<link rel="icon" href="Remote/icon192.png" id="favicon">
<link rel="apple-touch-icon" href="Remote/icon192.png" id="touchicon">
<style>
  :root {
    --bg: #0e0f12;
    --surface: #181a20;
    --surface-2: #22252d;
    --surface-3: #2c3039;
    --line: #2f333c;
    --text: #eef0f3;
    --text-2: #cfd3da;
    --muted: #9aa1ad;
    --accent: #3ea6ff;
    --accent-ink: #06121f;
    --danger: #ff6b6b;
    --ok: #46d483;
    --red: #e5484d; --green: #30a46c; --yellow: #f5d90a; --blue: #3e63dd;
    --radius: 16px;
    --appbar-h: 60px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    overscroll-behavior-y: none;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  a { color: inherit; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { width: 24px; height: 24px; fill: currentColor; display: block; flex: none; }
  select, input[type=search] {
    font: inherit; font-size: 15px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px;
  }

  /* Top bar */
  .appbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 2px;
    padding: max(8px, env(safe-area-inset-top)) 6px 8px;
    background: rgba(14, 15, 18, .94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .appbar-title { flex: 1; min-width: 0; font-weight: 650; font-size: 18px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); flex: none; }
  .icon-btn:active { background: var(--surface-3); }
  .appbar .icon-btn { background: transparent; }
  .appbar .icon-btn:active { background: var(--surface-2); }

  .view { max-width: 980px; margin: 0 auto; padding: 4px 16px calc(28px + env(safe-area-inset-bottom)); }
  body.has-mini .view { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
  .loading { color: var(--muted); text-align: center; padding: 28px 0; font-size: 15px; }

  /* Home */
  .libs { display: flex; gap: 10px; flex-wrap: wrap; padding: 6px 0 4px; }
  .lib-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 23px; background: var(--surface); text-decoration: none; font-weight: 600; }
  .lib-btn:active { background: var(--surface-3); }
  .lib-btn svg { width: 20px; height: 20px; color: var(--accent); }
  h2.section { font-size: 17px; font-weight: 650; margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h2.section a { font-size: 14px; color: var(--accent); text-decoration: none; font-weight: 500; white-space: nowrap; }
  .hrow {
    display: grid; grid-auto-flow: column; grid-auto-columns: 114px; gap: 12px;
    overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
    margin: 0 -16px; padding: 0 16px 4px; scroll-padding: 0 16px;
  }
  .hrow::-webkit-scrollbar { display: none; }

  /* Posters */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 16px 12px; }
  .card { color: inherit; text-decoration: none; display: flex; flex-direction: column; gap: 6px; scroll-snap-align: start; min-width: 0; }
  .card .poster { position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
  .card:active .poster { opacity: .8; }
  .card .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 8px; text-align: center; color: var(--muted); font-size: 13px; }
  .card .name { font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .year { font-size: 12px; color: var(--muted); margin-top: -4px; }
  .badge { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .badge svg { width: 15px; height: 15px; }
  .bar-mini { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0, 0, 0, .55); }
  .bar-mini span { display: block; height: 100%; background: var(--accent); }

  /* Library */
  .toolbar { position: sticky; top: var(--appbar-h); z-index: 4; display: flex; gap: 8px; align-items: center; padding: 6px 0 12px; background: var(--bg); }
  .toolbar select { flex: 0 1 auto; min-width: 0; }
  .toggle { min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--surface); font-size: 15px; white-space: nowrap; }
  .toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .count { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .search-box { position: sticky; top: var(--appbar-h); z-index: 4; background: var(--bg); padding: 6px 0 12px; }
  .search-box input { width: 100%; }

  /* Item page */
  .hero { position: relative; margin: 0 -16px; aspect-ratio: 16 / 9; max-height: 44vh; overflow: hidden; background: var(--surface); }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(14,15,18,0) 35%, rgba(14,15,18,.75) 75%, var(--bg) 100%); }
  .dhead { display: flex; gap: 14px; align-items: flex-end; margin-top: -72px; position: relative; z-index: 1; }
  .dposter { width: 104px; aspect-ratio: 2 / 3; border-radius: 10px; object-fit: cover; background: var(--surface-2); box-shadow: 0 8px 28px rgba(0,0,0,.55); flex: none; }
  .dtitle { min-width: 0; padding-bottom: 2px; }
  .dtitle h1 { font-size: 21px; line-height: 1.2; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .badges:empty { display: none; }
  .vb { font-size: 12px; font-weight: 700; letter-spacing: .3px; line-height: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); white-space: nowrap; }
  .vb.res { color: var(--text); border-color: #4a505c; }
  .vb.dv { color: #d4b8ff; border-color: rgba(190, 150, 255, .45); background: rgba(150, 100, 255, .10); }
  .vb.hdr { color: #f3d35b; border-color: rgba(243, 211, 91, .4); background: rgba(243, 211, 91, .08); }
  /* Disc format: labels in the usual colours (these are not the official logos). */
  .vb.src { font-style: italic; letter-spacing: .2px; }
  .vb.src.bluray { color: #fff; border-color: transparent; background: linear-gradient(180deg, #3b8ff0, #1257b8); }
  .vb.src.uhd { color: #fff; border-color: #6b7280; background: linear-gradient(180deg, #2a2d33, #050506); }
  .vb.src.dvd { color: #111; border-color: transparent; background: linear-gradient(180deg, #f5f5f5, #cfd2d6); }
  .vb.src.file, .vb.src.iso, .vb.src.folder { font-style: normal; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 14px; }
  .btn { min-height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; padding: 0 16px; }
  .btn svg { width: 22px; height: 22px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:active { filter: brightness(.9); }
  .btn.secondary { background: var(--surface); }
  .btn.secondary:active { background: var(--surface-3); }
  .fields { display: grid; gap: 12px; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  .field select { width: 100%; }
  .note { margin: 0; color: var(--muted); font-size: 14px; }
  .overview { color: var(--text-2); font-size: 15px; line-height: 1.55; margin: 6px 0 14px; cursor: pointer; }
  .overview.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .pill { min-height: 46px; border-radius: 12px; background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; font-size: 15px; }
  .pill:active { background: var(--surface-3); }
  .pill svg { width: 20px; height: 20px; }
  .pill.on { color: var(--accent); }

  /* Mini player */
  .mini {
    position: fixed; left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); z-index: 6;
    max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 8px;
    background: var(--surface-2); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.55); cursor: pointer;
  }
  .mini img, .mini .m-ph { width: 40px; height: 60px; border-radius: 6px; object-fit: cover; background: var(--surface-3); flex: none; }
  .m-text { flex: 1; min-width: 0; }
  .m-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-state { color: var(--muted); font-size: 13px; }
  .mini .icon-btn { background: var(--surface-3); }

  /* Playback (remote) */
  #player { display: flex; flex-direction: column; gap: 14px; max-width: 460px; }
  .status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dev { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--text-2); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); transition: background .3s; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--danger); }
  #power.off { color: var(--danger); }
  .now { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .now-top { display: flex; gap: 14px; align-items: center; min-height: 72px; }
  .now .p-poster { width: 56px; height: 84px; border-radius: 8px; object-fit: cover; background: var(--surface-2); flex: none; }
  .now-text { min-width: 0; flex: 1; }
  .p-title { font-size: 18px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .progress { display: flex; flex-direction: column; gap: 6px; }
  .bar { height: 28px; display: flex; align-items: center; cursor: pointer; touch-action: manipulation; }
  .track { position: relative; height: 6px; width: 100%; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 3px; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .transport { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; }
  .t-btn { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); }
  .t-btn:active { background: var(--surface-3); }
  .t-btn.main { width: 72px; height: 72px; background: var(--accent); color: var(--accent-ink); }
  .t-btn.main:active { filter: brightness(.9); }
  .t-btn.main svg { width: 34px; height: 34px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 10px; }
  .row .pill { display: flex; }
  .pill.stop { color: var(--danger); }
  .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .side { display: flex; flex-direction: column; gap: 12px; }
  .side.left { align-items: flex-start; }
  .side.right { align-items: flex-end; }
  .labelled { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); width: 64px; text-align: center; }
  .labelled .icon-btn { width: 48px; height: 48px; color: var(--text); }
  .pad { position: relative; width: 196px; height: 196px; border-radius: 50%; background: var(--surface); }
  .pad .arrow { position: absolute; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; }
  .pad .arrow:active { background: var(--surface-3); }
  .pad .arrow svg { width: 30px; height: 30px; }
  .pad .up { top: 2px; left: 66px; } .pad .down { bottom: 2px; left: 66px; }
  .pad .left { left: 2px; top: 66px; } .pad .right { right: 2px; top: 66px; }
  .pad .ok { position: absolute; inset: 58px; border-radius: 50%; background: var(--surface-3); font-weight: 700; font-size: 17px; }
  .pad .ok:active { background: var(--accent); color: var(--accent-ink); }
  section.card-box, details.card-box { background: var(--surface); border-radius: var(--radius); padding: 12px 14px 14px; }
  .card-box h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 2px 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 38px; padding: 6px 12px; border-radius: 19px; background: var(--surface-2); font-size: 14px; text-align: left; }
  .chip:active { background: var(--surface-3); }
  .chip.selected { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .empty { color: var(--muted); font-size: 14px; }
  details.card-box summary { cursor: pointer; list-style: none; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  details.card-box summary::-webkit-details-marker { display: none; }
  details.card-box summary { display: flex; justify-content: space-between; align-items: center; }
  details.card-box summary::after { content: ""; width: 8px; height: 8px; margin-right: 4px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform .2s; }
  details.card-box[open] summary::after { transform: rotate(-135deg); }
  details.card-box .more { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .color { min-height: 40px; border-radius: 10px; }
  .color.red { background: var(--red); } .color.green { background: var(--green); }
  .color.yellow { background: var(--yellow); } .color.blue { background: var(--blue); }
  .pill.small { min-height: 42px; background: var(--surface-2); font-size: 14px; }
  .account { display: flex; justify-content: center; gap: 16px; color: var(--muted); font-size: 13px; padding-top: 4px; }
  .account { flex-wrap: wrap; }
  .account button { color: var(--muted); text-decoration: underline; }
  .account a { color: var(--accent); }
  .account select { min-height: 0; padding: 2px 6px; font-size: 13px; border-radius: 8px; color: var(--muted); background: transparent; }

  /* Sign-in */
  .login { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; padding: 24px 16px; z-index: 10; }
  .login form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
  .login img { width: 72px; height: 72px; align-self: center; border-radius: 16px; }
  .login h1 { font-size: 20px; margin: 0; text-align: center; }
  .login p { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }
  .login label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
  .login input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .login input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .login .submit { min-height: 48px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 650; }
  .login .error { color: var(--danger); min-height: 20px; }

  /* Additions 0.10 */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dlogo { display: block; max-width: 100%; max-height: 66px; object-fit: contain; object-position: left bottom; margin-bottom: 8px; }
  .vb.aud { color: #8fe3cf; border-color: rgba(100, 220, 190, .35); background: rgba(100, 220, 190, .07); }
  .cb { position: absolute; left: 6px; bottom: 9px; display: flex; gap: 3px; }
  .cb span { font-size: 10px; font-weight: 800; letter-spacing: .2px; padding: 2px 4px; border-radius: 4px; background: rgba(0, 0, 0, .75); color: #fff; }
  .cb .dv { color: #d4b8ff; } .cb .hdr { color: #f3d35b; }
  .row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; }
  .pill.fav.on { color: #ff6b8a; }
  .crew { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  .crew b { color: var(--text-2); font-weight: 600; }
  .people { grid-auto-columns: 84px; }
  .person { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: inherit; scroll-snap-align: start; min-width: 0; }
  .person img, .person .pph { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: var(--surface-2); }
  .person .pn { font-size: 12px; line-height: 1.2; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .person .pr { font-size: 11px; color: var(--muted); text-align: center; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .toolbar { flex-wrap: wrap; }
  .toggle svg { width: 18px; height: 18px; display: inline-block; vertical-align: -4px; margin-right: 4px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 0 14px; }
  .filters .field { font-size: 12px; }
  .search-box { display: flex; gap: 8px; }
  .search-box input { flex: 1; min-width: 0; }
  .mic.listening { background: var(--danger); color: #fff; }
  .lib-btn.alt svg { color: #f3d35b; }
  .pperson { display: flex; align-items: center; gap: 14px; margin: 8px 0 18px; }
  .pperson img, .pperson .pph { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; background: var(--surface-2); }
  .pperson h1 { font-size: 21px; margin: 0; }

  /* 0.11: playback screen, chapters, sleep timer */
  #player { position: relative; z-index: 0; }
  .p-bg { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; filter: blur(22px) brightness(.32) saturate(1.2); transform: scale(1.12); opacity: 0; transition: opacity .6s; pointer-events: none; }
  .p-bg.on { opacity: 1; }
  .now { background: rgba(24, 26, 32, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .now .p-poster { width: 84px; height: 126px; }
  .p-logo { display: block; max-width: 100%; max-height: 48px; object-fit: contain; object-position: left; margin-bottom: 4px; }
  .p-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .p-badges .vb { font-size: 11px; padding: 4px 6px; }
  .chap-row { grid-auto-columns: 150px; }
  .chap { display: flex; flex-direction: column; gap: 4px; text-align: left; scroll-snap-align: start; }
  .chap .thumb { display: block; position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 2px solid transparent; }
  .chap .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chap.current .thumb { border-color: var(--accent); }
  .chap .cbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0, 0, 0, .55); display: none; }
  .chap .cbar span { display: block; height: 100%; width: 0; background: var(--accent); }
  .chap.current .cbar { display: block; }
  .chap .ct { display: block; font-size: 12px; color: var(--muted); }
  .chap.current .ct { color: var(--accent); font-weight: 600; }
  .out-box { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
  .out-box dt { color: var(--muted); }
  .out-box dd { margin: 0; font-weight: 600; color: var(--text-2); }
  .sleep-choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .sleep-status { color: var(--muted); font-size: 13px; text-align: center; }
  .pill.on { color: var(--accent); }

  /* 0.11: two-column item page and remote alongside, on landscape tablets */
  @media (min-width: 900px) and (orientation: landscape) {
    .dcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; align-items: start; }
    .dcols .dcol-r { padding-top: 18px; }
  }
  @media (min-width: 1100px) and (orientation: landscape) {
    #player, #player[hidden] {
      display: flex !important; position: fixed; top: var(--appbar-h); right: 0; bottom: 0; width: 400px; max-width: none;
      overflow-y: auto; margin: 0; padding: 12px 16px 24px; border-left: 1px solid var(--line); background: var(--bg);
    }
    #player .p-bg { position: absolute; }
    #views { margin-right: 400px; }
    .mini { display: none !important; }
    #nav-player { display: none !important; }

    var name = '';
    if (code && code !== 'und') { try { name = langNames ? langNames.of(code) : ''; } catch (e) { name = ''; } }
    if (!name || name === code) name = stream.DisplayLanguage || (code && code !== 'und' ? code.toUpperCase() : t('unknown_lang'));
    return name.charAt(0).toUpperCase() + name.slice(1);
  }
  var CODECS = { truehd: 'TrueHD', ac3: 'Dolby Digital', eac3: 'Dolby Digital+', dts: 'DTS', aac: 'AAC', flac: 'FLAC', mp2: 'MP2', mp3: 'MP3', opus: 'Opus', vorbis: 'Vorbis' };
  function audioLabel(s) {
    var codec = s.Profile || CODECS[(s.Codec || '').toLowerCase()] || (/^pcm/i.test(s.Codec || '') ? 'PCM' : (s.Codec || '').toUpperCase());
    var layout = s.ChannelLayout === 'stereo' ? t('stereo') : s.ChannelLayout === 'mono' ? t('mono') : (s.ChannelLayout || (s.Channels ? t('n_channels', s.Channels) : ''));
    var parts = [langLabel(s), [codec, layout].filter(Boolean).join(' ')];
    if (s.Title && !/^(stereo|surround|5\.1|7\.1)$/i.test(s.Title)) parts.push(s.Title);
    return parts.filter(Boolean).join(' · ');
  }
  function subtitleLabel(s) {
    var label = langLabel(s);
    if (s.IsForced) label += t('forced');
    if (s.IsHearingImpaired) label += t('sdh');
    if (s.Title) label += ' · ' + s.Title;
    return label;
  }
  /** Track labels, numbered when several are identical ("French 1", "French 2"…). */
  function numbered(list, labeler) {
    var labels = list.map(labeler), totals = {}, seen = {};
    labels.forEach(function (l) { totals[l] = (totals[l] || 0) + 1; });
    return list.map(function (s, i) {
      var l = labels[i];
      if (totals[l] > 1) { seen[l] = (seen[l] || 0) + 1; l += ' ' + seen[l]; }
      return { stream: s, label: l };
    });
  }
  function streams(source, type) {
    return ((source && source.MediaStreams) || []).filter(function (s) { return s.Type === type; });
  }

  /**
   * Video format labels: resolution, dynamic range (Dolby Vision, plus HDR10 when the disc is
   * compatible: profiles 6.1, 7.6 of UHD Blu-ray and 8.1), 3D, high frame rate.
   */
  function videoBadges(source, item) {
    var out = [];
    var v = streams(source, 'Video')[0];
    if (v) {
      var w = v.Width || 0, h = v.Height || 0, scan = v.IsInterlaced ? 'i' : 'p';
      var res = w >= 3800 || h >= 2100 ? '4K'
        : w >= 2500 || h >= 1400 ? '1440' + scan
        : w >= 1900 || h >= 1000 ? '1080' + scan
        : w >= 1200 || h >= 700 ? '720' + scan
        : h ? (h >= 560 ? '576' : '480') + scan : '';
      if (res) out.push({ text: res, cls: 'res' });
      var type = v.ExtendedVideoType || '', sub = v.ExtendedVideoSubType || '';
      if (type === 'DolbyVision') {
        out.push({ text: 'Dolby Vision', cls: 'dv' });
        if (/^DoviProfile(61|76|81)$/.test(sub)) out.push({ text: 'HDR10', cls: 'hdr' });
        else if (sub === 'DoviProfile84') out.push({ text: 'HLG', cls: 'hdr' });
      }
      else if (type === 'Hdr10Plus') out.push({ text: 'HDR10+', cls: 'hdr' });
      else if (type === 'Hdr10') out.push({ text: 'HDR10', cls: 'hdr' });
      else if (type === 'HyperLogGamma') out.push({ text: 'HLG', cls: 'hdr' });
      else if (/hdr/i.test(v.VideoRange || '')) out.push({ text: 'HDR', cls: 'hdr' });
      var fps = v.RealFrameRate || v.AverageFrameRate || 0;
      if (fps >= 47) out.push({ text: t('fps', Math.round(fps)), cls: '' });
    }
    var name = (source && (source.Name || source.Path)) || item.Path || '';
    if (item.Video3DFormat || /(^|[\s\[(._-])3D($|[\s\]).,_-])/i.test(name)) out.push({ text: '3D', cls: '' });
    return out;
  }

  var formats = {};
  function discFormat(q) {
    var key = q.Id + '|' + (q.MediaSourceId || '');
    if (!formats[key]) formats[key] = remote('/Format', q).catch(function (err) { delete formats[key]; throw err; });
    return formats[key];

  /** Default audio track: the Emby user's preferred language, otherwise the disc's default. */
  function defaultAudio(source) {
    var list = streams(source, 'Audio');
    if (!list.length) return null;
    var cfg = (user && user.Configuration) || {};
    var pref = lang2(cfg.AudioLanguagePreference || LANG);
    if (!cfg.PlayDefaultAudioTrack) {
      var match = list.filter(function (s) { return lang2(s.Language) === pref; })[0];
      if (match) return match.Index;
    }
    if (source.DefaultAudioStreamIndex !== null && source.DefaultAudioStreamIndex !== undefined) return source.DefaultAudioStreamIndex;
    return list[0].Index;
  }

  /** Default subtitles according to the mode chosen in Emby ("smart": only when the audio is in a foreign language). */
  function defaultSubtitle(source, audioStream) {
    var list = streams(source, 'Subtitle');

    var subPref = lang2(cfg.SubtitleLanguagePreference || cfg.AudioLanguagePreference || LANG);
    var inPref = list.filter(function (s) { return lang2(s.Language) === subPref; });
    var full = inPref.filter(function (s) { return !s.IsForced; })[0] || inPref[0];
    var forced = inPref.filter(function (s) { return s.IsForced; })[0];
    switch (cfg.SubtitleMode) {

      case 'OnlyForced': return forced ? forced.Index : -1;

  // ------------------------------------------------------------ Navigation

  var cache = new Map();          // views kept in memory (scroll position preserved)
  var currentKey = null, currentRoute = null, started = false;
  var stack = [];                 // stack for the "back" button

  function parseRoute() {
    var h = location.hash.replace(/^#/, '') || '/';
    var m;
    if ((m = h.match(/^\/item\/([^/?#]+)/))) return { name: 'item', id: m[1], key: '/item/' + m[1] };
    if ((m = h.match(/^\/lib\/([^/?#]+)/))) return { name: 'lib', id: m[1], key: '/lib/' + m[1] };
    if ((m = h.match(/^\/person\/([^/?#]+)/))) return { name: 'person', id: m[1], key: '/person/' + m[1] };
    if (h.indexOf('/search') === 0) return { name: 'search', key: '/search' };
    if (h.indexOf('/player') === 0) return { name: 'player', key: '/player' };
    return { name: 'home', key: '/' };
  }

  function setTitle(text) { $('appbar-title').textContent = text || 'OPPO'; }

  function onRoute() {
    if (!started) return;
    var r = parseRoute();
    if (stack.length > 1 && stack[stack.length - 2] === r.key) stack.pop();
    else if (stack[stack.length - 1] !== r.key) stack.push(r.key);
    show(r);
  }
  window.addEventListener('hashchange', onRoute);

  $('nav-back').addEventListener('click', function () {
    if (stack.length > 1) history.back(); else location.hash = '#/';
  });
  $('nav-search').addEventListener('click', function () { location.hash = '#/search'; });
  $('nav-player').addEventListener('click', function () { location.hash = '#/player'; });

  function show(r) {
    if (currentKey && cache.has(currentKey)) cache.get(currentKey).scroll = window.scrollY;
    cache.forEach(function (v) { v.node.hidden = true; });
    $('player').hidden = true;
    currentKey = r.key;
    currentRoute = r;
    $('nav-back').hidden = r.name === 'home';
    $('nav-search').hidden = r.name === 'search';
    $('nav-player').hidden = r.name === 'player';
    $('nav-power').hidden = r.name !== 'player';

    if (r.name === 'player' && wide()) { location.replace('#/'); return; }
    if (r.name === 'player') {
      $('player').hidden = false;
      setTitle(t('remote'));
      window.scrollTo(0, 0);
      updateMini();
      wantTracks = true;
      schedule(30);
      return;
    }

    var entry = cache.get(r.key);
    if (entry && r.name === 'item') { entry.node.remove(); cache.delete(r.key); entry = null; } // item page always fresh
    if (!entry) {
      entry = { key: r.key, node: null, scroll: 0, title: '' };
      entry.node = build(r, entry);
      $('views').appendChild(entry.node);
      cache.set(r.key, entry);
      trimCache();
    } else {
      entry.node.hidden = false;
      if (entry.onShow) entry.onShow();
    }
    setTitle(entry.title);
    var y = entry.scroll || 0;
    window.scrollTo(0, y);
    requestAnimationFrame(function () { window.scrollTo(0, y); });
    updateMini();
    schedule(300);
  }

  function trimCache() {
    if (cache.size <= 12) return;
    var keys = Array.from(cache.keys());
    for (var i = 0; i < keys.length && cache.size > 12; i++) {
      if (keys[i] !== currentKey && keys[i] !== '/') { cache.get(keys[i]).node.remove(); cache.delete(keys[i]); }
    }
  }

  function retitle(entry, text) {
    entry.title = text;
    if (currentKey === entry.key) setTitle(text);
  }

  function build(r, entry) {
    switch (r.name) {
      case 'lib': return buildLibrary(entry, r.id);
      case 'person': return buildPerson(entry, r.id);
      case 'item': return buildItem(entry, r.id);
      case 'search': return buildSearch(entry);
      default: return buildHome(entry);
    }
  }

  // ------------------------------------------------------------ Home

  function buildHome(entry) {
    entry.title = '';
    var libsBox = el('nav', { 'class': 'libs', 'aria-label': t('libraries') });

      });

        var sec = el('section');
        latest.appendChild(sec);
        emby('/Users/' + uid() + '/Items/Latest', { ParentId: lib.Id, Limit: 16, Fields: FIELDS, ImageTypeLimit: 1, EnableImageTypes: 'Primary' })
          .then(function (items) { if (items && items.length) fillRow(sec, t('recently_added_in', lib.Name), '#/lib/' + lib.Id, items); })
          .catch(function () { /* section skipped */ });
      });
    }).catch(function (err) {
      if (err && err.auth) return;
      libsBox.appendChild(el('div', { 'class': 'loading', text: t('cant_reach_emby') }));
    });
    var favorites = el('section');
    node.insertBefore(favorites, latest);
    var surpriseBtn = el('button', { 'class': 'lib-btn alt', type: 'button', html: icon('dice') }, [t('surprise')]);

    var seanceBtn = el('button', { 'class': 'lib-btn alt', type: 'button', html: icon('seance') }, [t('showtime')]);
    seanceBtn.addEventListener('click', function () { seance(true); });

    libsBox.appendChild(seanceBtn);

    }

      emby('/Users/' + uid() + '/Items/Resume', { Limit: 12, MediaTypes: 'Video', Fields: FIELDS, ImageTypeLimit: 1, EnableImageTypes: 'Primary' })
        .then(function (r) {
          resume.textContent = '';
          if (r && r.Items && r.Items.length) fillRow(resume, t('resume'), null, r.Items);
        }).catch(function () { /* section skipped */ });
      emby('/Users/' + uid() + '/Items', { Filters: 'IsFavorite', Recursive: true, IncludeItemTypes: 'Movie,MusicVideo,BoxSet', SortBy: 'SortName',
        Limit: 30, Fields: FIELDS, ImageTypeLimit: 1, EnableImageTypes: 'Primary' })
        .then(function (r) {
          favorites.textContent = '';
          if (r && r.Items && r.Items.length) fillRow(favorites, t('favorites'), null, r.Items);
        }).catch(function () { /* section skipped */ });

  function fillRow(section, title, more, items) {

    if (more) h.appendChild(el('a', { href: more, text: t('see_all') }));

  // ------------------------------------------------------------ Library / collection

  var SORTS = [

    { id: 'year', label: t('sort_year'), by: 'ProductionYear,SortName', order: 'Descending' },
    { id: 'rating', label: t('sort_rating'), by: 'CommunityRating,SortName', order: 'Descending' }

  function buildLibrary(entry, id) {
    var sort = el('select', { 'aria-label': t('sort_by') });

    var unplayed = el('button', { 'class': 'toggle', type: 'button', 'aria-pressed': 'false', text: t('unwatched') });

    var genreSel = el('select', { 'aria-label': t('genre') }, [el('option', { value: '', text: t('all_m') })]);
    var decadeSel = el('select', { 'aria-label': t('decade') }, [el('option', { value: '', text: t('all_f') })]);
    [2020, 2010, 2000, 1990, 1980, 1970, 1960, 1950].forEach(function (d) { decadeSel.appendChild(el('option', { value: String(d), text: t('decade_label', d >= 2000 ? d : String(d).slice(2), d) })); });
    decadeSel.appendChild(el('option', { value: 'old', text: t('before_1950') }));
    var imageSel = el('select', { 'aria-label': t('picture') }, [

    var favSel = el('select', { 'aria-label': t('favorites') }, [el('option', { value: '', text: t('all_m') }), el('option', { value: '1', text: t('favorites_only') })]);
    var filters = el('div', { 'class': 'filters', hidden: true }, [field(t('genre'), genreSel), field(t('era'), decadeSel), field(t('picture'), imageSel), field(t('favorites'), favSel)]);
    var node = el('div', { 'class': 'view' }, [el('div', { 'class': 'toolbar' }, [sort, unplayed, filterBtn, diceBtn, count]), filters, grid, status, sentinel]);
    emby('/Genres', { ParentId: id, UserId: uid(), SortBy: 'SortName' }).then(function (r) {
      ((r && r.Items) || []).forEach(function (g) { genreSel.appendChild(el('option', { value: g.Name, text: g.Name })); });

    [genreSel, decadeSel, imageSel, favSel].forEach(function (x) {

    });
    function applyFilters(q) {

      else if (decadeSel.value) { var d0 = +decadeSel.value, ys = []; for (var b = d0; b < d0 + 10; b++) ys.push(b); q.Years = ys.join(','); }

    function query() {
      var s = SORTS.filter(function (x) { return x.id === sort.value; })[0] || SORTS[0];
      var order = parent.Type === 'BoxSet' && s.id === 'year' ? 'Ascending' : s.order;
      var q = { ParentId: id, SortBy: s.by, SortOrder: order, StartIndex: st.start, Limit: 60, Fields: FIELDS,

      if (!parent || st.loading || (st.total !== null && st.start >= st.total)) return;

        st.total = items.length ? r.TotalRecordCount : st.start;

  // ------------------------------------------------------------ Search

  function buildSearch(entry) {
    entry.title = t('search_title');
    var input = el('input', { type: 'search', placeholder: t('search_placeholder'), autocomplete: 'off', enterkeyhint: 'search', 'aria-label': t('search') });
    var status = el('div', { 'class': 'loading', text: '' });
    var grid = el('div', { 'class': 'grid' });
    var box = el('div', { 'class': 'search-box' }, [input]);
    var node = el('div', { 'class': 'view' }, [box, status, grid]);
    var timer, gen = 0;
    var Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (window.OppoAndroid && window.OppoAndroid.canListen()) {
      var amic = el('button', { 'class': 'icon-btn mic', type: 'button', 'aria-label': t('voice_search'), html: icon('mic') });
      box.appendChild(amic);
      amic.addEventListener('click', function () {
        buzz();
        window.oppoVoiceResult = function (text) {
          if (!text) { toast(t('heard_nothing')); return; }
          input.value = text.replace(/[.?!]+$/, '');
          run();
        };
        window.OppoAndroid.listen();
      });
    } else if (Speech) {
      var mic = el('button', { 'class': 'icon-btn mic', type: 'button', 'aria-label': t('voice_search'), html: icon('mic') });
      box.appendChild(mic);
      mic.addEventListener('click', function () {
        var rec;
        try { rec = new Speech(); } catch (e) { toast(t('mic_unavailable')); return; }
        rec.lang = LANG === 'fr' ? 'fr-FR' : 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
        rec.onresult = function (ev) { input.value = ev.results[0][0].transcript.replace(/[.?!]+$/, ''); run(); };
        rec.onerror = function (ev) { toast(ev.error === 'not-allowed' ? t('mic_denied') : t('heard_nothing')); };
        rec.onend = function () { mic.classList.remove('listening'); };
        mic.classList.add('listening');
        buzz();
        try { rec.start(); } catch (e) { mic.classList.remove('listening'); }
      });
    }
    input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 300); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') input.blur(); });
    function run() {
      var q = input.value.trim();
      var g = ++gen;
      if (q.length < 2) { grid.textContent = ''; status.textContent = ''; return; }
      status.textContent = t('searching');
      emby('/Users/' + uid() + '/Items', { SearchTerm: q, Recursive: true, IncludeItemTypes: 'Movie,MusicVideo,BoxSet,Series,Video',
        Limit: 60, Fields: FIELDS, ImageTypeLimit: 1, EnableImageTypes: 'Primary' })
        .then(function (r) {
          if (g !== gen) return;
          grid.textContent = '';
          var items = r.Items || [];
          status.textContent = items.length ? '' : t('no_results');
          items.forEach(function (i) { grid.appendChild(card(i)); });
          decorate(grid);
        }).catch(function (err) { if (g === gen) { status.textContent = ''; onError(err); } });
    }
    entry.onShow = function () { if (!input.value) setTimeout(function () { input.focus(); }, 80); };

    return node;
  }

  // ------------------------------------------------------------ Item page

  function buildItem(entry, id) {

    if (item.PartCount > 1) meta.push(t('n_discs', item.PartCount));
    if (item.CommunityRating) meta.push('★ ' + (LANG === 'fr' ? item.CommunityRating.toFixed(1).replace('.', ',') : item.CommunityRating.toFixed(1)));
    if (item.OfficialRating) meta.push(item.OfficialRating);
    var logo = image(item, 'Logo', 200);
    var startPos = (item.UserData && item.UserData.PlaybackPositionTicks) || 0;
    var endLine = item.RunTimeTicks && !(item.PartCount > 1)
      ? t('ends_around', clock(new Date(Date.now() + (item.RunTimeTicks - startPos) / 1e4))) + (startPos > 0 ? t('if_resuming') : '')
      : null;
    node.appendChild(el('div', { 'class': 'dhead' }, [
      poster ? el('img', { 'class': 'dposter', src: poster, alt: '' }) : el('div', { 'class': 'dposter' }),
      el('div', { 'class': 'dtitle' }, [
        logo ? el('img', { 'class': 'dlogo', src: logo, alt: '' }) : null,

        el('div', { 'class': 'meta', text: meta.join(' · ') }),

        endLine ? el('div', { 'class': 'meta', text: endLine }) : null
      ])
    ]));

    var sources = item.MediaSources || [];
    var badges = el('div', { 'class': 'badges', 'aria-label': t('video_format') });
    var actions = el('div', { 'class': 'actions' });
    var fields = el('div', { 'class': 'fields' });
    // Two columns on landscape tablets (stacked on phones).
    var head = node.lastChild;
    var colL = el('div', { 'class': 'dcol-l' }), colR = el('div', { 'class': 'dcol-r' });
    node.appendChild(el('div', { 'class': 'dcols' }, [colL, colR]));
    colL.appendChild(head);
    colL.appendChild(badges);
    colL.appendChild(actions);
    colL.appendChild(fields);

    // Multi-disc item: choice of the starting disc (the following ones then play in sequence).
    var discs = null, discSel = null;
    if (item.PartCount > 1) {
      discs = [item];
      discSel = el('select');
      discSel.appendChild(el('option', { value: '0', text: discLabel(0, item) }));
      fields.appendChild(field(t('disc'), discSel));
      emby('/Videos/' + item.Id + '/AdditionalParts', { UserId: uid(), Fields: 'MediaSources' }).then(function (r) {
        ((r && r.Items) || []).forEach(function (part) {
          discs.push(part);
          discSel.appendChild(el('option', { value: String(discs.length - 1), text: discLabel(discs.length - 1, part) }));
        });
        drawActions();
      }).catch(function () { /* following discs unknown: play from the first one */ });
      discSel.addEventListener('change', function () { fillTracks(); drawActions(); });
    }
    function disc() { return discSel ? +discSel.value : 0; }
    function discLabel(i, part) { return t('disc_n', i + 1) + (part.RunTimeTicks ? ' · ' + runtime(part.RunTimeTicks) : ''); }

    var sourceSel = null;
    if (sources.length > 1) {
      sourceSel = el('select');
      sources.forEach(function (s, i) { sourceSel.appendChild(el('option', { value: String(i), text: s.Name || t('version_n', i + 1) })); });
      fields.appendChild(field(t('version'), sourceSel));
    }
    var audioSel = el('select'), subSel = el('select');
    var audioField = field(t('audio'), audioSel), subField = field(t('subtitles'), subSel);
    fields.appendChild(audioField);
    fields.appendChild(subField);

    function source() {
      var d = disc();
      if (d > 0 && discs[d] && discs[d].MediaSources && discs[d].MediaSources.length) return discs[d].MediaSources[0];
      return sources[sourceSel ? +sourceSel.value : 0] || null;
    }
    function fillTracks() {
      var s = source();
      badges.textContent = '';
      videoBadges(s, item).forEach(function (b) { badges.appendChild(el('span', { 'class': 'vb ' + b.cls, text: b.text })); });
      // Disc format (Blu-ray, UHD Blu-ray, DVD, MKV…), asked from the plugin, which reads the file.
      var d = disc(), ask = d > 0 && discs[d] ? { Id: discs[d].Id } : { Id: item.Id, MediaSourceId: sourceSel ? sources[+sourceSel.value].Id : null };
      var mark = badges.dataset.mark = String(Math.random());
      discFormat(ask).then(function (f) {
        if (!f || !f.Label || badges.dataset.mark !== mark) return;
        badges.insertBefore(el('span', { 'class': 'vb src ' + (f.Kind || 'file'), text: f.Label }), badges.firstChild);
      }).catch(function () { /* unknown format: no label */ });
      var audio = streams(s, 'Audio'), subs = streams(s, 'Subtitle');
      audioSel.textContent = '';
      subSel.textContent = '';
      numbered(audio, audioLabel).forEach(function (o) { audioSel.appendChild(el('option', { value: String(o.stream.Index), text: o.label })); });
      audioField.hidden = !audio.length;
      var da = defaultAudio(s);
      if (da !== null) audioSel.value = String(da);
      subSel.appendChild(el('option', { value: '-1', text: t('none') }));
      numbered(subs, subtitleLabel).forEach(function (o) { subSel.appendChild(el('option', { value: String(o.stream.Index), text: o.label })); });
      subField.hidden = !subs.length;
      var current = audio.filter(function (a) { return String(a.Index) === audioSel.value; })[0];
      subSel.value = String(defaultSubtitle(s, current));
      drawAudioBadges(current);
    }
    function drawAudioBadges(stream) {
      Array.prototype.forEach.call(badges.querySelectorAll('.vb.aud'), function (b) { b.remove(); });
      audioBadges(stream).forEach(function (t) { badges.appendChild(el('span', { 'class': 'vb aud', text: t })); });
    }
    if (sourceSel) sourceSel.addEventListener('change', fillTracks);
    audioSel.addEventListener('change', function () {
      var s = source();
      var current = streams(s, 'Audio').filter(function (a) { return String(a.Index) === audioSel.value; })[0];
      subSel.value = String(defaultSubtitle(s, current));
      drawAudioBadges(current);
    });
    fillTracks();
    if (item.PartCount > 1) fields.appendChild(el('p', { 'class': 'note', text: t('discs_chain') }));

    function go(startTicks, startIndex) {
      buzz();
      launch(item, {
        MediaSourceId: sourceSel ? sources[+sourceSel.value].Id : null,
        AudioStreamIndex: audioField.hidden ? null : audioSel.value,
        SubtitleStreamIndex: subField.hidden ? null : subSel.value,
        StartPositionTicks: startTicks,
        StartIndex: startIndex
      });
    }
    function button(cls, iconName, text, onClick) {
      var b = el('button', { 'class': 'btn ' + cls, type: 'button', html: iconName ? icon(iconName) : '' }, [el('span', { text: text })]);
      b.addEventListener('click', onClick);
      return b;
    }
    var pos = (item.UserData && item.UserData.PlaybackPositionTicks) || 0;
    /** Resume disc and position (same computation as the plugin: based on each disc's runtime). */
    function resumePoint() {
      var part = 0, offset = 0;
      if (discs && discs.length > 1) {
        for (var i = 0; i < discs.length - 1; i++) {
          var d = discs[i].RunTimeTicks || 0;
          if (d <= 0 || pos < offset + d) break;
          offset += d;
          part = i + 1;
        }
      }
      return { part: part, inner: pos - offset };
    }
    function drawActions() {
      actions.textContent = '';
      var d = disc(), multi = !!discSel;
      if (pos > 0) {
        var rp = resumePoint();
        actions.appendChild(button('primary', 'play', t('resume_at', fmt(rp.inner / 1e7)) + (multi ? t('resume_disc', rp.part + 1) : ''), function () { go(pos, null); }));
        actions.appendChild(button('secondary', null, d > 0 ? t('play_disc_from_start', d + 1) : t('play_from_start'), function () { go(0, multi ? d : null); }));
      } else {
        actions.appendChild(button('primary', 'play', d > 0 ? t('play_disc_on', d + 1, deviceLabel()) : t('play_on', deviceLabel()), function () { go(0, multi ? d : null); }));
      }
    }
    drawActions();

    if (item.Overview) {
      var ov = el('p', { 'class': 'overview clamp', text: item.Overview });
      ov.addEventListener('click', function () { ov.classList.toggle('clamp'); });
      colR.appendChild(ov);
    }

    var played = !!(item.UserData && item.UserData.Played);
    var playedBtn = el('button', { 'class': 'pill', type: 'button' });
    function drawPlayed() {
      playedBtn.innerHTML = icon('check');
      playedBtn.appendChild(el('span', { text: played ? t('watched') : t('mark_watched') }));
      playedBtn.classList.toggle('on', played);
      playedBtn.setAttribute('aria-pressed', played ? 'true' : 'false');
    }
    drawPlayed();
    playedBtn.addEventListener('click', function () {
      emby('/Users/' + uid() + '/PlayedItems/' + item.Id, null, played ? 'DELETE' : 'POST').then(function () {
        played = !played;
        drawPlayed();
        markCards(item.Id, played);
      }).catch(onError);
    });
    var fav = !!(item.UserData && item.UserData.IsFavorite);
    var favBtn = el('button', { 'class': 'pill fav', type: 'button' });
    function drawFav() {
      favBtn.innerHTML = icon('heart');
      favBtn.appendChild(el('span', { text: fav ? t('favorite') : t('add_favorite') }));
      favBtn.classList.toggle('on', fav);
      favBtn.setAttribute('aria-pressed', fav ? 'true' : 'false');
    }
    drawFav();
    favBtn.addEventListener('click', function () {
      buzz();
      emby('/Users/' + uid() + '/FavoriteItems/' + item.Id, null, fav ? 'DELETE' : 'POST').then(function () {
        fav = !fav;
        drawFav();
      }).catch(onError);
    });
    colL.appendChild(el('div', { 'class': 'row-btns' }, [playedBtn, favBtn]));

    // Director and cast (a tap opens the person's other movies).
    var people = item.People || [];
    var directors = people.filter(function (x) { return x.Type === 'Director'; }).slice(0, 3);
    if (directors.length) {
      var crew = el('p', { 'class': 'crew' }, [t('directed_by')]);
      directors.forEach(function (d, i) {
        if (i) crew.appendChild(document.createTextNode(', '));
        crew.appendChild(el('a', { href: '#/person/' + d.Id }, [el('b', { text: d.Name })]));
      });
      colR.appendChild(crew);
    }
    var cast = people.filter(function (x) { return x.Type === 'Actor'; }).slice(0, 20);
    if (cast.length) {
      var row = el('div', { 'class': 'hrow people' });
      cast.forEach(function (a) {
        var img = a.PrimaryImageTag
          ? el('img', { src: BASE + '/Items/' + a.Id + '/Images/Primary?maxHeight=160&quality=85&tag=' + a.PrimaryImageTag, loading: 'lazy', alt: '' })
          : el('span', { 'class': 'pph' });
        row.appendChild(el('a', { 'class': 'person', href: '#/person/' + a.Id }, [img, el('span', { 'class': 'pn', text: a.Name }), a.Role ? el('span', { 'class': 'pr', text: a.Role }) : null]));
      });
      colR.appendChild(el('h2', { 'class': 'section' }, [el('span', { text: t('cast') })]));

  // ------------------------------------------------------------ Person page

  function buildPerson(entry, id) {
    var head = el('div', { 'class': 'pperson' });
    var grid = el('div', { 'class': 'grid' });
    var status = el('div', { 'class': 'loading', text: t('loading') });
    var node = el('div', { 'class': 'view' }, [head, status, grid]);
    emby('/Users/' + uid() + '/Items/' + id).then(function (p) {
      retitle(entry, p.Name);
      var tag = p.ImageTags && p.ImageTags.Primary;
      head.appendChild(tag ? el('img', { src: BASE + '/Items/' + p.Id + '/Images/Primary?maxHeight=200&quality=85&tag=' + tag, alt: '' }) : el('span', { 'class': 'pph' }));
      head.appendChild(el('h1', { text: p.Name }));
    }).catch(function () { /* name unknown */ });
    emby('/Users/' + uid() + '/Items', { PersonIds: id, Recursive: true, IncludeItemTypes: 'Movie,MusicVideo', SortBy: 'ProductionYear,SortName',
      SortOrder: 'Descending', Fields: FIELDS, ImageTypeLimit: 1, EnableImageTypes: 'Primary', Limit: 200 }).then(function (r) {
      var items = (r && r.Items) || [];
      status.textContent = items.length ? (items.length > 1 ? t('n_titles_lib', items.length) : t('n_title_lib', items.length)) : t('no_titles');
      items.forEach(function (i) { grid.appendChild(card(i)); });
      decorate(grid);
    }).catch(function (err) { if (!(err && err.auth)) status.textContent = t('cant_load_titles'); });
    return node;
  }

  function deviceLabel() { return last.deviceName || t('the_oppo'); }

  var pending = null;   // movie being started (before the OPPO confirms it)

  function launch(item, options) {
    function send(sessionId) {
      if (!sessionId) throw new Error('nosession');
      var q = { ItemIds: item.Id, PlayCommand: 'PlayNow', StartPositionTicks: options.StartPositionTicks || 0 };
      if (options.MediaSourceId) q.MediaSourceId = options.MediaSourceId;
      if (options.AudioStreamIndex !== null && options.AudioStreamIndex !== undefined) q.AudioStreamIndex = options.AudioStreamIndex;
      if (options.SubtitleStreamIndex !== null && options.SubtitleStreamIndex !== undefined) q.SubtitleStreamIndex = options.SubtitleStreamIndex;
      if (options.StartIndex !== null && options.StartIndex !== undefined) q.StartIndex = options.StartIndex;
      return emby('/Sessions/' + sessionId + '/Playing', q, 'POST');
    }
    (last.sessionId ? Promise.resolve(last.sessionId) : remote('/State').then(function (s) { render(s); return s.SessionId; }))
      .then(send)
      .then(function () {
        pending = { at: Date.now(), Title: item.Name, ItemId: item.Id, ImageTag: item.ImageTags && item.ImageTags.Primary };
        toast(t('launching_on', deviceLabel()));
        location.hash = '#/player';
      })
      .catch(function (err) {
        if (err && err.auth) return;
        toast(err && err.message === 'nosession' ? t('no_session') : t('launch_failed'));
      });
  }

  // ------------------------------------------------------------ Remote

  var last = { state: '', reachable: false, position: 0, duration: 0, at: 0, sessionId: null, deviceName: null, title: null };

  function setOnline(on) {
    $('dot').classList.toggle('on', on);
    $('dot').classList.toggle('off', !on);
  }

  function setPoster(img, itemId, tag, size) {
    if (itemId && tag) {
      var src = BASE + '/Items/' + encodeURIComponent(itemId) + '/Images/Primary?maxHeight=' + size + '&quality=90&tag=' + encodeURIComponent(tag);
      if (img.getAttribute('src') !== src) img.src = src;
      img.hidden = false;
      return true;
    }
    img.hidden = true;
    img.removeAttribute('src');
    return false;
  }

  function render(s) {
    var state = (s.State || '').toUpperCase();
    var playing = PLAYING.indexOf(state) >= 0;
    last.state = state;
    last.reachable = !!s.Reachable;
    last.sessionId = s.SessionId || last.sessionId;
    last.deviceName = s.DeviceName || last.deviceName;
    $('device').textContent = last.deviceName || 'OPPO';
    setOnline(!!s.Reachable);
    $('power').classList.toggle('off', !s.Reachable);
    $('power').setAttribute('aria-label', s.Reachable ? t('power_off_oppo') : t('power_on_oppo'));

    var title = s.Title, itemId = s.ItemId, tag = s.ImageTag;
    var stateText = s.Reachable ? (STATES[state] || state) : t('off_or_offline');
    if (s.Title) pending = null;
    if (!title && pending && Date.now() - pending.at < 120000) {
      title = pending.Title; itemId = pending.ItemId; tag = pending.ImageTag;
      stateText = t('launching_state', stateText.toLowerCase());
    }
    last.title = title || null;
    last.itemId = itemId; last.imageTag = tag; last.stateText = stateText;

    loadPlayerItem(itemId);
    drawSleep(s);
    if (!playing) $('p-out').hidden = true;
    else if (s.OutputVideo !== undefined || s.OutputAudio !== undefined) {
      var out = $('p-out');
      out.textContent = '';
      [[t('output'), s.OutputVideo], [' · ', s.OutputAudio], [t('subs_short'), s.OutputSubtitle ? s.OutputSubtitle.toLowerCase() : '']].forEach(function (x) {
        if (!x[1]) return;
        out.appendChild(el('b', { text: out.childNodes.length ? x[0] : t('output') }));
        out.appendChild(document.createTextNode(x[1]));
      });
      out.hidden = !out.childNodes.length;
    }
    $('dot2').classList.toggle('on', !!s.Reachable);
    $('dot2').classList.toggle('off', !s.Reachable);
    $('nav-power').classList.toggle('off', !s.Reachable);
    markChapter(playing ? s.Chapter : null);
    $('p-title').textContent = title || (s.Reachable ? t('no_film') : t('oppo_unreachable'));
    $('p-state').textContent = stateText;
    $('p-chapter').textContent = playing && s.Chapter ? t('chapter_n', s.Chapter) : '';
    setPoster($('p-poster'), itemId, tag, 252);

    var pp = state === 'PLAY' || state === 'FFWD' || state === 'FREV' ? '#i-pause' : '#i-play';
    document.querySelectorAll('.pp-icon').forEach(function (u) { u.setAttribute('href', pp); });

    if (playing && s.Duration > 0) {
      last.position = s.Position; last.duration = s.Duration; last.at = Date.now();
      $('progress').hidden = false;
      drawProgress();
    } else {
      $('progress').hidden = true;
      $('p-end').textContent = '';
      last.duration = 0;
    }

    if (!playing) {
      emptyTracks('audio'); emptyTracks('subtitles');
    } else {
      if (s.Audio) drawTracks('audio', s.Audio, false);
      if (s.Subtitles) drawTracks('subtitles', s.Subtitles, true);
    }
    updateMini();
  }

  // ---------- Current movie: backdrop, logo, format, chapters

  var playerItemId = null;
  var chapterTimes = [];   // start of each chapter (s), for the current thumbnail's bar
  function loadPlayerItem(itemId) {
    if ((itemId || null) === playerItemId) return;
    playerItemId = itemId || null;
    var bg = $('p-bg'), logo = $('p-logo'), badgeBox = $('p-badges'), box = $('chap-box'), row = $('chapters');
    bg.classList.remove('on'); logo.hidden = true; $('p-title').hidden = false;
    badgeBox.textContent = ''; row.textContent = ''; box.hidden = true; chapterTimes = [];
    if (!itemId || !uid()) return;
    emby('/Users/' + uid() + '/Items/' + itemId, { Fields: 'MediaSources,PartCount' }).then(function (item) {
      if (playerItemId !== itemId) return;
      var back = image(item, 'Backdrop', 1100);
      if (back) { bg.style.backgroundImage = 'url("' + back + '")'; bg.classList.add('on'); }
      var lg = image(item, 'Logo', 160);
      if (lg) { logo.src = lg; logo.hidden = false; $('p-title').hidden = true; }
      var src = (item.MediaSources || [])[0];
      videoBadges(src, item).forEach(function (b) { badgeBox.appendChild(el('span', { 'class': 'vb ' + b.cls, text: b.text })); });
      discFormat({ Id: item.Id }).then(function (f) {
        if (f && f.Label && playerItemId === itemId) badgeBox.insertBefore(el('span', { 'class': 'vb src ' + (f.Kind || 'file'), text: f.Label }), badgeBox.firstChild);
      }).catch(function () { /* unknown format */ });
      if (item.PartCount > 1) return;   // multi-disc concerts: chapters of the current disc unknown
      return remote('/Chapters', { Id: item.Id }).then(function (list) {
        if (playerItemId !== itemId || !list || list.length < 2) return;
        list.forEach(function (c) {
          var b = el('button', { 'class': 'chap', type: 'button', 'data-index': String(c.Index), 'aria-label': t('go_chapter', c.Index + 1) }, [
            el('span', { 'class': 'thumb' }, [
              el('img', { src: API + '/ChapterImage?Id=' + encodeURIComponent(item.Id) + '&Index=' + c.Index, loading: 'lazy', alt: '' }),
              el('span', { 'class': 'cbar' }, [el('span')])
            ]),
            el('span', { 'class': 'ct', text: (c.Index + 1) + ' · ' + fmt(c.Seconds) })
          ]);
          b.addEventListener('click', function () {
            buzz();
            last.position = c.Seconds; last.at = Date.now(); drawProgress();
            remote('/Seek', { Seconds: Math.floor(c.Seconds) }, 'POST').then(function (r) {
              if (r && !r.Ok) toast(r.Message || t('seek_refused'));
              schedule(800);
            }).catch(onError);
          });
          row.appendChild(b);
        });
        chapterTimes = list.map(function (c) { return c.Seconds; });
        box.hidden = false;
        markChapter(last.chapterText, true);
      });
    }).catch(function () { /* item unavailable: plain display */ });
  }

  function markChapter(text, force) {
    if (text === last.chapterText && !force) return;
    last.chapterText = text;
    var m = /^(\d+)/.exec(text || '');
    var current = m ? +m[1] - 1 : -1;
    Array.prototype.forEach.call($('chapters').children, function (c) {
      var on = +c.getAttribute('data-index') === current;
      c.classList.toggle('current', on);
      if (on && !$('chap-box').hidden && !document.hidden) {
        var row = $('chapters');
        row.scrollTo({ left: Math.max(0, c.offsetLeft - row.clientWidth / 2 + c.clientWidth / 2), behavior: 'smooth' });
      }
    });
  }

  // ---------- Sleep timer

  function drawSleep() { /* sleep timer removed from the UI (0.12.2) */ }

  function updateMini() {
    var show = started && !!currentRoute && currentRoute.name !== 'player' &&
      (!!last.title || BUSY.indexOf(last.state) >= 0);
    $('mini').hidden = !show;
    document.body.classList.toggle('has-mini', show);
    if (!show) return;
    $('m-title').textContent = last.title || t('playing_on', deviceLabel());
    $('m-state').textContent = last.stateText || '';
    $('m-ph').hidden = setPoster($('m-poster'), last.itemId, last.imageTag, 120);
  }

  $('mini').addEventListener('click', function (e) {
    if (e.target.closest('#m-pp')) return;
    location.hash = '#/player';
  });
  $('mini').addEventListener('keydown', function (e) { if (e.key === 'Enter') location.hash = '#/player'; });
  $('m-pp').addEventListener('click', function () { sendKey(last.state === 'PLAY' ? 'PAU' : 'PLA'); });

  function currentPosition() {
    var pos = last.position;
    if (last.state === 'PLAY' && last.at) pos += (Date.now() - last.at) / 1000;
    return Math.min(pos, last.duration || pos);
  }
  function drawProgress() {
    if (!last.duration || ($('player').hidden && !wide())) return;
    var pos = currentPosition();
    var pct = Math.max(0, Math.min(100, pos / last.duration * 100));
    $('fill').style.width = pct + '%';
    $('bar').setAttribute('aria-valuenow', Math.round(pct));
    $('pos').textContent = fmt(pos);
    $('dur').textContent = '-' + fmt(last.duration - pos);
    $('p-end').textContent = t('ends_at', clock(new Date(Date.now() + (last.duration - pos) * 1000)));
    // Bar of the current thumbnail: progress within the chapter.
    var cur = document.querySelector('#chapters .chap.current');
    if (cur && chapterTimes.length) {
      var i = +cur.getAttribute('data-index');
      var start = chapterTimes[i], end = i + 1 < chapterTimes.length ? chapterTimes[i + 1] : last.duration;
      var cp = end > start ? Math.max(0, Math.min(100, (pos - start) / (end - start) * 100)) : 0;
      cur.querySelector('.cbar span').style.width = cp + '%';
    }
  }
  setInterval(drawProgress, 500);

  function emptyTracks(id) {
    var box = $(id);
    if (box.dataset.empty === '1') return;
    box.dataset.empty = '1';
    box.textContent = '';
    box.appendChild(el('span', { 'class': 'empty', text: t('during_playback') }));
  }
  function oppoTrackLabel(track, subtitles) {
    if (subtitles && track.Index === 0) return t('none');
    return (track.Name || t('track_n', track.Index)).replace(/^\s*\d+\s*\/\s*\d+\s*/, '');
  }
  function drawTracks(id, list, subtitles) {
    var box = $(id);
    box.dataset.empty = '0';
    box.textContent = '';
    if (!list.length) {
      box.appendChild(el('span', { 'class': 'empty', text: subtitles ? t('no_subs_here') : t('no_tracks_here') }));
      return;
    }
    list.forEach(function (track) {
      var b = el('button', { 'class': 'chip' + (track.Selected ? ' selected' : ''), type: 'button', 'aria-pressed': track.Selected ? 'true' : 'false', text: oppoTrackLabel(track, subtitles) });
      b.addEventListener('click', function () {
        buzz();
        Array.prototype.forEach.call(box.children, function (c) { c.classList.remove('selected'); });
        b.classList.add('selected');
        remote(subtitles ? '/Subtitle' : '/Audio', { Index: track.Index }, 'POST').then(function (r) {
          if (r && !r.Ok) toast(r.Message || t('refused_by_oppo'));
          wantTracks = true; schedule(1200);
        }).catch(onError);
      });
      box.appendChild(b);
    });
  }

  function sendKey(code) {
    buzz();
    return remote('/Key', { Code: code }, 'POST').then(function (r) {
      if (r && !r.Ok) toast(r.Message || t('key_refused'));
      schedule(400);
    }).catch(onError);
  }

  document.addEventListener('click', function (e) {
    var k = e.target.closest('[data-key]');
    if (k) sendKey(k.getAttribute('data-key'));
  });
  function jump(seconds) {
    if (!last.duration) { toast(t('during_film')); return; }
    var target = Math.max(0, Math.min(last.duration - 5, Math.floor(currentPosition() + seconds)));
    buzz();
    last.position = target; last.at = Date.now(); drawProgress();
    remote('/Seek', { Seconds: target }, 'POST').then(function (r) {
      if (r && !r.Ok) toast(r.Message || t('seek_refused'));
      schedule(800);
    }).catch(onError);
  }
  $('back30').addEventListener('click', function () { jump(-30); });
  $('fwd30').addEventListener('click', function () { jump(30); });
  $('seance-on').addEventListener('click', function () { seance(true); });
  $('seance-off').addEventListener('click', function () { seance(false); });

  $('playpause').addEventListener('click', function () { sendKey(last.state === 'PLAY' ? 'PAU' : 'PLA'); });
  $('nav-power').addEventListener('click', function () { $('power').click(); });
  $('power').addEventListener('click', function () {
    if (last.reachable) {
      if (confirm(t('confirm_power_off'))) sendKey('POF');
    } else {
      toast(t('powering_on'));
      sendKey('PON');
    }
  });
  $('bar').addEventListener('click', function (e) {
    if (!last.duration) return;
    var rect = e.currentTarget.getBoundingClientRect();
    var target = Math.floor(Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * last.duration);
    buzz();
    last.position = target; last.at = Date.now(); drawProgress();
    remote('/Seek', { Seconds: target }, 'POST').then(function (r) {
      if (r && !r.Ok) toast(r.Message || t('seek_refused'));
      schedule(800);
    }).catch(onError);
  });

  // ------------------------------------------------------------ OPPO state polling

  var pollTimer = null, polling = false, again = false, count = 0, wantTracks = true;

  var wideQuery = window.matchMedia ? window.matchMedia('(min-width: 1100px) and (orientation: landscape)') : null;
  function wide() { return !!(wideQuery && wideQuery.matches); }
  if (wideQuery && wideQuery.addEventListener) wideQuery.addEventListener('change', function () {
    if (wide() && currentRoute && currentRoute.name === 'player') location.replace('#/');
    updateMini(); schedule(100);
  });
  function onPlayer() { return wide() || (!!currentRoute && currentRoute.name === 'player'); }

  function poll() {
    if (!started) return;
    if (polling) { again = true; return; }
    polling = true;
    var tracks = onPlayer() && (wantTracks || count % 4 === 0);
    if (tracks) wantTracks = false;
    count++;
    remote('/State', { Tracks: tracks }).then(render).catch(function (err) {
      if (err && err.auth) return;
      setOnline(false);
      $('p-state').textContent = t('emby_down');
    }).then(function () {
      polling = false;
      if (again) { again = false; schedule(100); } else schedule(onPlayer() ? 2000 : 5000);
    });
  }
  function schedule(delay) {
    clearTimeout(pollTimer);
    if (!started || document.hidden) return;
    pollTimer = setTimeout(poll, delay);
  }
  function stopPolling() { clearTimeout(pollTimer); }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && started) { wantTracks = true; poll(); }
  });

  // ------------------------------------------------------------ Startup

  function measureAppbar() {
    document.documentElement.style.setProperty('--appbar-h', $('appbar').offsetHeight + 'px');
  }
  window.addEventListener('resize', measureAppbar);

  function start() {
    $('who').textContent = auth.userName ? t('signed_in_as', auth.userName) : '';
    started = true;
    measureAppbar();
    getUser().catch(function () { /* default preferences */ });
    stack = [];
    onRoute();
    poll();
  }

  // Full screen: Chrome keeps its address bar as long as the page is not served over HTTPS. The top-bar
  // button switches to full screen; the choice is remembered and re-applied on the first touch (the
  // browser requires a gesture) every time the app is opened or returned to.
  var FS_KEY = 'oppoRemote.fullscreen';
  function fsWanted() { try { return localStorage.getItem(FS_KEY) === '1'; } catch (e) { return false; } }
  function fsRemember(on) { try { localStorage.setItem(FS_KEY, on ? '1' : '0'); } catch (e) { /* not remembered */ } }
  function fsEnter() {
    var root = document.documentElement;
    if (document.fullscreenElement || !root.requestFullscreen) return;
    root.requestFullscreen({ navigationUI: 'hide' }).catch(function () { /* refused */ });
  }
  var inApp = !!window.OppoAndroid;
  if (document.fullscreenEnabled && !inApp) $('nav-fs').hidden = false;
  if (inApp) {
    $('change-server').hidden = false;
    $('change-server').addEventListener('click', function () { window.OppoAndroid.changeServer(); });
  } else if (/Android/i.test(navigator.userAgent)) {
    $('get-app').href = API + '/oppo.apk';
    $('get-app').hidden = false;
  }
  $('nav-fs').addEventListener('click', function (e) {
    e.stopPropagation();
    if (document.fullscreenElement) { fsRemember(false); document.exitFullscreen().catch(function () {}); }
    else { fsRemember(true); fsEnter(); }
  });
  document.addEventListener('fullscreenchange', function () {
    $('fs-icon').setAttribute('href', document.fullscreenElement ? '#i-fs-exit' : '#i-fs');
    setTimeout(measureAppbar, 300);
  });
  document.addEventListener('click', function () { if (fsWanted()) fsEnter(); }, true);

  // Service worker: required for Chrome to offer "Install app" (page served over HTTPS,
  // or address allowed in chrome://flags). No effect elsewhere.
  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register(API + '/sw.js', { scope: BASE + '/Oppo/' }).catch(function () { /* installation not possible */ });
  }

  if (auth.token) start(); else showLogin();
})();
</script>
</body>
</html>
